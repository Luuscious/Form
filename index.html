<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <div class="main-container">
        <form id="incident-form" class="form-data" action="upload.php" method="post" enctype="multipart/form-data" novalidate>
            <label for="officer-name">Name of Officer</label><br>
            <input type="text" id="officer-name" name="name-of-officer" placeholder="Enter the Officer's name" required><br>
            <small class="error"></small>
 
            <label for="officer-id">Officer ID</label><br>
            <input type="text" name="id-of-officer" id="officer-id" placeholder="Enter Officer ID" required><br>
            <small class="error"></small>

            <label for="incident-date">Date of Incident</label><br>
            <input
                type="date"
                id="incident-date"
                name="date-of-incident"
                value="2018-07-22"
                min="1997-01-01"
                max="2050-12-31" required><br>
            <small class="error"></small>

                <label for="appt">Time of Incident</label><br>
                <input type="time" id="appt" name="appt" required><br>
                <small class="error"></small>

                <label for="reporters-comment">Report:</label><br>
                <textarea name="comment" id="reporters-comment" placeholder="Describe the incident..." required></textarea><br><br>
                <small class="error"></small>

                <label for="imageUpload">Choose an image to upload:</label><br>
                <input type="file" id="imageUpload" name="image" accept="image/*"><br>
                <small class="error"></small>

                <button type="submit">Submit</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
