<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <div class="main-container">
        <form class="form-data" action="upload.php" method="post" enctype="multipart/form-data">
            <label for="officer-name">Name of Officer</label><br>
            <input type="text" id="officer-name" name="name-of-officer" placeholder="Enter the Officer's name" ><br>
 
            <label for="officer-id">Officer ID</label><br>
            <input type="text" name="id-of-officer" id="officer-id" placeholder="Enter Officer ID"><br>

            <label for="date-of-report">Date of Report</label><br>
            <input
                type="date"
                id="report-date"
                name="date-of-report"
                value="2018-07-22"
                min="1997-01-01"
                max="2050-12-31" ><br>

                <label for="appt">Time of Report</label><br>
                <input type="time" id="appt" name="appt"><br>

                <label for="imageUpload">Choose an image to upload:</label><br>
                <input type="file" id="imageUpload" name="image" accept="image/*"><br>
                <input type="submit" value="Upload Image">
        </form>
    </div>
</body>
</html>
